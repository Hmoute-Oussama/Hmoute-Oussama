<text class="m" x="62" y="150" fill="#3C4C5E" font-size="9.5" letter-spacing="1.5">PUBLIC REPOSITORIES</text>
<line x1="227" y1="74" x2="227" y2="166" stroke="#16202C"/>
<text class="m" x="249" y="112" fill="#D7E3F0" font-size="32" font-weight="600">62</text>
