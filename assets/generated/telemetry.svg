<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Live GitHub telemetry">
  <title>Telemetry</title>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#131C26" stroke-width="1"/></pattern>
    <style>
      .m{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .fade{opacity:0;animation:fade .7s ease forwards}
      @keyframes fade{to{opacity:1}}
      .flow{stroke-dasharray:6 7;animation:flow 1.8s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      .breathe{animation:breathe 3.4s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}
    </style>
  </defs>
  <rect width="1200" height="190" fill="#0A0E14"/>
  <rect width="1200" height="190" fill="url(#g)"/>
<text class="m" x="40" y="42" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4">05 / TELEMETRY</text>
<text class="m" x="1160" y="42" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4" text-anchor="end">SOURCE: GITHUB REST API &#183; AS OF 2026-11-24</text>
<line x1="40" y1="58" x2="1160" y2="58" stroke="#16202C"/>
<text class="m" x="62" y="112" fill="#D7E3F0" font-size="32" font-weight="600">87</text>
