<text class="m" x="249" y="150" fill="#3C4C5E" font-size="9.5" letter-spacing="1.5">STARS RECEIVED</text>
<line x1="413" y1="74" x2="413" y2="166" stroke="#16202C"/>
<text class="m" x="435" y="112" fill="#D7E3F0" font-size="32" font-weight="600">2</text>
<rect x="435" y="126" width="26" height="2.5" rx="1.25" fill="#A78BFA"/>
<text class="m" x="435" y="150" fill="#3C4C5E" font-size="9.5" letter-spacing="1.5">FOLLOWERS</text>
