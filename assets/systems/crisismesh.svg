<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330"
     role="img" aria-label="CrisisMesh architecture: intake, extract, guard, reconcile, graph">
  <title>CrisisMesh architecture</title>

  <defs>
    <pattern id="c-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#131C26" stroke-width="1"/>
    </pattern>
    <style>
      .cm{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .c-fade{opacity:0;animation:cfade .7s ease forwards}
      @keyframes cfade{to{opacity:1}}
      .c-flow{stroke-dasharray:6 7;animation:cflow 1.8s linear infinite}
      @keyframes cflow{to{stroke-dashoffset:-26}}
      .c-pulse{animation:cp 3.4s ease-in-out infinite}
      @keyframes cp{0%,100%{opacity:.25}50%{opacity:.85}}
    </style>
  </defs>

  <rect width="1100" height="330" fill="#0A0E14"/>
  <rect width="1100" height="330" fill="url(#c-grid)"/>

  <text class="cm" x="42" y="36" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4">Hmoute-Oussama/CrisisMesh-Apertus</text>
  <text class="cm" x="1058" y="36" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4" text-anchor="end">TPS 0.8433 &#183; GROUNDING 1.0</text>
  <line x1="42" y1="50" x2="1058" y2="50" stroke="#16202C"/>

  <!-- verification loop -->
  <path class="c-flow" fill="none" stroke="#3A5068" stroke-width="1.2" d="M962 92V66H338v26"/>
  <path fill="#3A5068" d="M338 92l-5 -9h10z"/>
  <text class="cm" x="650" y="60" fill="#4C5D70" font-size="9.5" letter-spacing="1.6" text-anchor="middle">unverified nodes re-enter reconciliation</text>

  <!-- forward edges -->
  <g fill="none" stroke="#2E4257" stroke-width="1.3">
    <path class="c-flow" style="animation-delay:.4s" d="M218 128H242"/>
    <path class="c-flow" style="animation-delay:.6s" d="M426 128H450"/>
    <path class="c-flow" style="animation-delay:.8s" d="M634 128H658"/>
    <path class="c-flow" style="animation-delay:1s"  d="M842 128H866"/>
  </g>
  <g fill="#2E4257">
    <path d="M246 128l-9 -5v10z"/>
    <path d="M454 128l-9 -5v10z"/>
    <path d="M662 128l-9 -5v10z"/>
    <path d="M870 128l-9 -5v10z"/>
  </g>

  <!-- stages -->
  <g class="c-fade" style="animation-delay:.1s">
    <rect x="42" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="42" y="92" width="3" height="72" rx="1.5" fill="#60A5FA"/>
    <text class="cm" x="62" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">INTAKE</text>
    <text class="cm" x="62" y="144" fill="#6E8095" font-size="9">ar, darija, en reports</text>
  </g>
  <g class="c-fade" style="animation-delay:.25s">
    <rect x="250" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="250" y="92" width="3" height="72" rx="1.5" fill="#4CC2FF"/>
    <text class="cm" x="270" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">EXTRACT</text>
    <text class="cm" x="270" y="144" fill="#6E8095" font-size="9">GBNF grammar decoding</text>
  </g>
  <g class="c-fade" style="animation-delay:.4s">
    <rect x="458" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="458" y="92" width="3" height="72" rx="1.5" fill="#F87171"/>
    <text class="cm" x="478" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">GUARD</text>
    <text class="cm" x="478" y="144" fill="#6E8095" font-size="9">abstention + injection defence</text>
  </g>
  <g class="c-fade" style="animation-delay:.55s">
    <rect x="666" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="666" y="92" width="3" height="72" rx="1.5" fill="#F5A524"/>
    <text class="cm" x="686" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">RECONCILE</text>
    <text class="cm" x="686" y="144" fill="#6E8095" font-size="9">contradictions + dedup</text>
  </g>
  <g class="c-fade" style="animation-delay:.7s">
    <rect x="874" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="874" y="92" width="3" height="72" rx="1.5" fill="#34D399"/>
    <rect class="c-pulse" x="874" y="92" width="176" height="72" rx="8" fill="none" stroke="#34D399" stroke-width="1"/>
    <text class="cm" x="894" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">GRAPH</text>
    <text class="cm" x="894" y="144" fill="#6E8095" font-size="9">verification per node</text>
  </g>

  <!-- artefacts -->
  <g class="cm" font-size="10" fill="#8FA3B8">
    <rect class="c-fade" style="animation-delay:.3s"  x="42"  y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="c-fade" style="animation-delay:.3s"  x="58"  y="207">raw text, immutable</text>
    <rect class="c-fade" style="animation-delay:.45s" x="250" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="c-fade" style="animation-delay:.45s" x="266" y="207">taxonomy-bounded fields</text>
    <rect class="c-fade" style="animation-delay:.6s"  x="458" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="c-fade" style="animation-delay:.6s"  x="474" y="207">abstain, drop or flag</text>
    <rect class="c-fade" style="animation-delay:.75s" x="666" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="c-fade" style="animation-delay:.75s" x="682" y="207">evidence-level merge</text>
    <rect class="c-fade" style="animation-delay:.9s"  x="874" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="c-fade" style="animation-delay:.9s"  x="890" y="207">situation graph</text>
  </g>

  <line x1="42" y1="248" x2="1058" y2="248" stroke="#16202C"/>
  <text class="cm" x="42" y="272" fill="#5E7386" font-size="10" letter-spacing="1.2">disciplines: grammars generated from the taxonomy &#183; abstain rather than guess &#183; truth is measured, not asserted</text>
  <text class="cm" x="42" y="294" fill="#5E7386" font-size="10" letter-spacing="1.2">signal: Truth Preservation Score gates promotion &#183; cross-language place identity &#183; contradiction detection</text>
  <text class="cm" x="42" y="316" fill="#3C4C5E" font-size="10" letter-spacing="1.2">primitives: FastAPI &#183; SQLAlchemy &#183; NetworkX &#183; llama.cpp GGUF &#183; dashboard pending</text>

  <rect x="0.5" y="0.5" width="1099" height="329" fill="none" stroke="#1B2735"/>
</svg>
