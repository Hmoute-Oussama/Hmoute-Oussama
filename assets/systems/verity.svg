<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330"
     role="img" aria-label="VERITY architecture: capture, verify, record, invalidate, guard">
  <title>VERITY architecture</title>

  <defs>
    <pattern id="v-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#131C26" stroke-width="1"/>
    </pattern>
    <style>
      .vm{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .v-fade{opacity:0;animation:vfade .7s ease forwards}
      @keyframes vfade{to{opacity:1}}
      .v-flow{stroke-dasharray:6 7;animation:vflow 1.8s linear infinite}
      @keyframes vflow{to{stroke-dashoffset:-26}}
      .v-pulse{animation:vp 3.4s ease-in-out infinite}
      @keyframes vp{0%,100%{opacity:.25}50%{opacity:.85}}
    </style>
  </defs>

  <rect width="1100" height="330" fill="#0A0E14"/>
  <rect width="1100" height="330" fill="url(#v-grid)"/>

  <text class="vm" x="42" y="36" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4">Hmoute-Oussama/VERITY</text>
  <text class="vm" x="1058" y="36" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4" text-anchor="end">PYPI v1.0.0 &#183; MIT</text>
  <line x1="42" y1="50" x2="1058" y2="50" stroke="#16202C"/>

  <!-- re-verify loop -->
  <path class="v-flow" fill="none" stroke="#3A5068" stroke-width="1.2" d="M754 92V66H338v26"/>
  <path fill="#3A5068" d="M338 92l-5 -9h10z"/>
  <text class="vm" x="546" y="60" fill="#4C5D70" font-size="9.5" letter-spacing="1.6" text-anchor="middle">re-verify on change</text>

  <!-- forward edges -->
  <g fill="none" stroke="#2E4257" stroke-width="1.3">
    <path class="v-flow" style="animation-delay:.4s" d="M218 128H242"/>
    <path class="v-flow" style="animation-delay:.6s" d="M426 128H450"/>
    <path class="v-flow" style="animation-delay:.8s" d="M634 128H658"/>
    <path class="v-flow" style="animation-delay:1s"  d="M842 128H866"/>
  </g>
  <g fill="#2E4257">
    <path d="M246 128l-9 -5v10z"/>
    <path d="M454 128l-9 -5v10z"/>
    <path d="M662 128l-9 -5v10z"/>
    <path d="M870 128l-9 -5v10z"/>
  </g>

  <!-- stages -->
  <g class="v-fade" style="animation-delay:.1s">
    <rect x="42" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="42" y="92" width="3" height="72" rx="1.5" fill="#60A5FA"/>
    <text class="vm" x="62" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">CAPTURE</text>
    <text class="vm" x="62" y="144" fill="#6E8095" font-size="9">prose, transcripts, diffs</text>
  </g>
  <g class="v-fade" style="animation-delay:.25s">
    <rect x="250" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="250" y="92" width="3" height="72" rx="1.5" fill="#34D399"/>
    <text class="vm" x="270" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">VERIFY</text>
    <text class="vm" x="270" y="144" fill="#6E8095" font-size="9">independent checks</text>
  </g>
  <g class="v-fade" style="animation-delay:.4s">
    <rect x="458" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="458" y="92" width="3" height="72" rx="1.5" fill="#4CC2FF"/>
    <text class="vm" x="478" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">RECORD</text>
    <text class="vm" x="478" y="144" fill="#6E8095" font-size="9">evidence + confidence</text>
  </g>
  <g class="v-fade" style="animation-delay:.55s">
    <rect x="666" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="666" y="92" width="3" height="72" rx="1.5" fill="#F5A524"/>
    <text class="vm" x="686" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">INVALIDATE</text>
    <text class="vm" x="686" y="144" fill="#6E8095" font-size="9">stale evidence</text>
  </g>
  <g class="v-fade" style="animation-delay:.7s">
    <rect x="874" y="92" width="176" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="874" y="92" width="3" height="72" rx="1.5" fill="#F87171"/>
    <rect class="v-pulse" x="874" y="92" width="176" height="72" rx="8" fill="none" stroke="#F87171" stroke-width="1"/>
    <text class="vm" x="894" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">GUARD</text>
    <text class="vm" x="894" y="144" fill="#6E8095" font-size="9">check before execute</text>
  </g>

  <!-- artefacts -->
  <g class="vm" font-size="10" fill="#8FA3B8">
    <rect class="v-fade" style="animation-delay:.3s"  x="42"  y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="v-fade" style="animation-delay:.3s"  x="58"  y="207">prose + diffs &#8594; claims</text>
    <rect class="v-fade" style="animation-delay:.45s" x="250" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="v-fade" style="animation-delay:.45s" x="266" y="207">36 verifiers</text>
    <rect class="v-fade" style="animation-delay:.6s"  x="458" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="v-fade" style="animation-delay:.6s"  x="474" y="207">SQLite evidence store</text>
    <rect class="v-fade" style="animation-delay:.75s" x="666" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="v-fade" style="animation-delay:.75s" x="682" y="207">invalidate on change</text>
    <rect class="v-fade" style="animation-delay:.9s"  x="874" y="180" width="176" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="v-fade" style="animation-delay:.9s"  x="890" y="207">block / warn / allow</text>
  </g>

  <line x1="42" y1="248" x2="1058" y2="248" stroke="#16202C"/>
  <text class="vm" x="42" y="272" fill="#5E7386" font-size="10" letter-spacing="1.2">verifiers: code_symbol &#183; code_route &#183; syntax &#183; imports &#183; dependency &#183; test_execution &#183; environment &#183; secret_scan &#183; database_schema &#183; http_probe</text>
  <text class="vm" x="42" y="294" fill="#5E7386" font-size="10" letter-spacing="1.2">surfaces: typer CLI &#183; MCP stdio server &#183; local dashboard &#183; GitHub Action &#183; pre-commit</text>
  <text class="vm" x="42" y="316" fill="#3C4C5E" font-size="10" letter-spacing="1.2">integration matrix: fastapi &#183; flask &#183; next.js &#183; docker compose &#183; monorepo &#183; typescript &#183; java &#183; go</text>

  <rect x="0.5" y="0.5" width="1099" height="329" fill="none" stroke="#1B2735"/>
</svg>
