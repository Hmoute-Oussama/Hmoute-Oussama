<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330"
     role="img" aria-label="AgentSnap architecture: run, record, assert, snapshot">
  <title>AgentSnap architecture</title>

  <defs>
    <pattern id="a-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#131C26" stroke-width="1"/>
    </pattern>
    <style>
      .am{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .a-fade{opacity:0;animation:afade .7s ease forwards}
      @keyframes afade{to{opacity:1}}
      .a-flow{stroke-dasharray:6 7;animation:aflow 1.8s linear infinite}
      @keyframes aflow{to{stroke-dashoffset:-26}}
      .a-pulse{animation:ap 3.4s ease-in-out infinite}
      @keyframes ap{0%,100%{opacity:.25}50%{opacity:.85}}
    </style>
  </defs>

  <rect width="1100" height="330" fill="#0A0E14"/>
  <rect width="1100" height="330" fill="url(#a-grid)"/>

  <text class="am" x="42" y="36" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4">Hmoute-Oussama/AgentSnap</text>
  <text class="am" x="1058" y="36" fill="#3C4C5E" font-size="10.5" letter-spacing="2.4" text-anchor="end">npm agentsnap &#183; MIT</text>
  <line x1="42" y1="50" x2="1058" y2="50" stroke="#16202C"/>

  <!-- baseline feedback loop -->
  <path class="a-flow" fill="none" stroke="#3A5068" stroke-width="1.2" d="M949 92V66H148v26"/>
  <path fill="#3A5068" d="M148 92l-5 -9h10z"/>
  <text class="am" x="548" y="60" fill="#4C5D70" font-size="9.5" letter-spacing="1.6" text-anchor="middle">baseline compared on every run</text>

  <!-- forward edges -->
  <g fill="none" stroke="#2E4257" stroke-width="1.3">
    <path class="a-flow" style="animation-delay:.4s" d="M258 128H301"/>
    <path class="a-flow" style="animation-delay:.7s" d="M525 128H568"/>
    <path class="a-flow" style="animation-delay:1s"  d="M792 128H835"/>
  </g>
  <g fill="#2E4257">
    <path d="M309 128l-9 -5v10z"/>
    <path d="M576 128l-9 -5v10z"/>
    <path d="M843 128l-9 -5v10z"/>
  </g>

  <!-- stages -->
  <g class="a-fade" style="animation-delay:.1s">
    <rect x="42" y="92" width="212" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="42" y="92" width="3" height="72" rx="1.5" fill="#A78BFA"/>
    <text class="am" x="62" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">RUN</text>
    <text class="am" x="62" y="144" fill="#6E8095" font-size="9">real agent, throwaway copy</text>
  </g>
  <g class="a-fade" style="animation-delay:.25s">
    <rect x="309" y="92" width="212" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="309" y="92" width="3" height="72" rx="1.5" fill="#60A5FA"/>
    <text class="am" x="329" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">RECORD</text>
    <text class="am" x="329" y="144" fill="#6E8095" font-size="9">files, commands, tool calls</text>
  </g>
  <g class="a-fade" style="animation-delay:.4s">
    <rect x="576" y="92" width="212" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="576" y="92" width="3" height="72" rx="1.5" fill="#34D399"/>
    <text class="am" x="596" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">ASSERT</text>
    <text class="am" x="596" y="144" fill="#6E8095" font-size="9">declarative checks, exit codes</text>
  </g>
  <g class="a-fade" style="animation-delay:.55s">
    <rect x="843" y="92" width="212" height="72" rx="8" fill="#0D1620" stroke="#1E2C3A"/>
    <rect x="843" y="92" width="3" height="72" rx="1.5" fill="#F5A524"/>
    <rect class="a-pulse" x="843" y="92" width="212" height="72" rx="8" fill="none" stroke="#F5A524" stroke-width="1"/>
    <text class="am" x="863" y="122" fill="#D7E3F0" font-size="12" letter-spacing="2">SNAPSHOT</text>
    <text class="am" x="863" y="144" fill="#6E8095" font-size="9">behavioural baseline; drift fails</text>
  </g>

  <!-- artefacts -->
  <g class="am" font-size="10" fill="#8FA3B8">
    <rect class="a-fade" style="animation-delay:.3s"  x="42"  y="180" width="212" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="a-fade" style="animation-delay:.3s"  x="58"  y="207">ephemeral repo copy</text>
    <rect class="a-fade" style="animation-delay:.45s" x="309" y="180" width="212" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="a-fade" style="animation-delay:.45s" x="325" y="207">file + command + tool trace</text>
    <rect class="a-fade" style="animation-delay:.6s"  x="576" y="180" width="212" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="a-fade" style="animation-delay:.6s"  x="592" y="207">assertion result + message</text>
    <rect class="a-fade" style="animation-delay:.75s" x="843" y="180" width="212" height="44" rx="7" fill="#0B131C" stroke="#16202C"/>
    <text class="a-fade" style="animation-delay:.75s" x="859" y="207">baseline diff</text>
  </g>

  <line x1="42" y1="248" x2="1058" y2="248" stroke="#16202C"/>
  <text class="am" x="42" y="272" fill="#5E7386" font-size="10" letter-spacing="1.2">guarantees: argv execution &#183; no shell &#183; environment allow-list &#183; path containment &#183; secret redaction</text>
  <text class="am" x="42" y="294" fill="#5E7386" font-size="10" letter-spacing="1.2">suite: unit &#183; integration against a deterministic fake provider &#183; end-to-end on the built binary</text>
  <text class="am" x="42" y="316" fill="#3C4C5E" font-size="10" letter-spacing="1.2">distribution: npm agentsnap &#183; GitHub composite action &#183; Docker sandbox &#183; CI spends no token</text>

  <rect x="0.5" y="0.5" width="1099" height="329" fill="none" stroke="#1B2735"/>
</svg>
