<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330"
     role="img" aria-label="AgentSnap architecture: run, record, assert, snapshot">
  <title>AgentSnap architecture</title>

  <defs>
    <pattern id="lat" width="48" height="27.7128" patternUnits="userSpaceOnUse" fill="none" stroke="#150F2C" stroke-width="1" opacity="0.85"><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(0,0)"/><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(48,0)"/><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(24.0,13.8564)"/><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(24.0,-13.8564)"/></pattern>
    <pattern id="lat2" width="156" height="90.0666" patternUnits="userSpaceOnUse" fill="none" stroke="#1B1338" stroke-width="1" opacity="0.5"><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(0,0)"/><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(156,0)"/><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(78.0,45.0333)"/><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(78.0,-45.0333)"/></pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D6BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E879F9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9D6BFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .fade{animation:fade .85s cubic-bezier(.2,.7,.2,1) both}
      @keyframes fade{from{opacity:0}}
      .draw{stroke-dasharray:1;animation:draw 1.7s cubic-bezier(.3,.7,.3,1) both}
      @keyframes draw{from{stroke-dashoffset:1}}
      .flow{stroke-dasharray:5 9;animation:flow 2.3s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-56}}
      .flow-r{stroke-dasharray:4 11;animation:flow-r 3.4s linear infinite}
      @keyframes flow-r{to{stroke-dashoffset:60}}
      .breathe{animation:breathe 3.8s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.2}50%{opacity:.9}}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){
        .fade,.draw,.flow,.flow-r,.breathe,.pulse{animation:none}
      }
    </style>
  </defs>

  <rect width="1100" height="330" fill="#05030C"/>
  <rect width="1100" height="330" fill="url(#lat)"/>
  <rect width="1100" height="330" fill="url(#lat2)"/>

  <text class="m" x="42" y="36" fill="#66569E" font-size="10.5" letter-spacing="2.4">Hmoute-Oussama/AgentSnap</text>
  <text class="m" x="1058" y="36" fill="#66569E" font-size="10.5" letter-spacing="2.4" text-anchor="end">npm agentsnap &#183; MIT</text>
  <path class="draw" pathLength="1" d="M42 50H1058" fill="none" stroke="#1E1544"/>

  <g class="fade" style="animation-delay:.2s">
    <!-- baseline feedback loop -->
    <path class="flow-r" fill="none" stroke="#54409C" stroke-width="1.2" d="M949 92V66H148v26"/>
    <path fill="#54409C" d="M148 92l-5 -9h10z"/>
    <text class="m" x="548" y="60" fill="#9486CC" font-size="9.5" letter-spacing="1.6" text-anchor="middle">baseline compared on every run</text>

    <!-- forward edges -->
    <g fill="none" stroke="#3E2C78" stroke-width="1.3">
      <path class="flow" style="animation-delay:.4s" d="M258 128H301"/>
      <path class="flow" style="animation-delay:.7s" d="M525 128H568"/>
      <path class="flow" style="animation-delay:1s"  d="M792 128H835"/>
    </g>
    <g fill="#3E2C78">
      <path d="M309 128l-9 -5v10z"/>
      <path d="M576 128l-9 -5v10z"/>
      <path d="M843 128l-9 -5v10z"/>
    </g>
    <circle r="2.6" fill="#5FD9FF"><animateMotion dur="7s" repeatCount="indefinite" path="M258 128H301"/></circle>
  </g>

  <!-- stages -->
  <g class="fade" style="animation-delay:.1s">
    <path d="M42 102L52 92H254V154L244 164H42Z" fill="#0F0A1E" stroke="#261B4E"/>
    <path d="M52 92H254" fill="none" stroke="#5FD9FF" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M42 134L46 130L42 126" fill="none" stroke="#5FD9FF" stroke-width="1.4" opacity="0.75"/>
    <text class="m" x="62" y="122" fill="#CFC5F7" font-size="12" letter-spacing="2">RUN</text>
    <text class="m" x="62" y="144" fill="#7A6AB4" font-size="9">real agent, throwaway copy</text>

    <path d="M309 102L319 92H521V154L511 164H309Z" fill="#0F0A1E" stroke="#261B4E"/>
    <path d="M319 92H521" fill="none" stroke="#9D6BFF" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M309 134L313 130L309 126" fill="none" stroke="#9D6BFF" stroke-width="1.4" opacity="0.75"/>
    <text class="m" x="329" y="122" fill="#CFC5F7" font-size="12" letter-spacing="2">RECORD</text>
    <text class="m" x="329" y="144" fill="#7A6AB4" font-size="9">files, commands, tool calls</text>

    <path d="M576 102L586 92H788V154L778 164H576Z" fill="#0F0A1E" stroke="#261B4E"/>
    <path d="M586 92H788" fill="none" stroke="#E879F9" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M576 134L580 130L576 126" fill="none" stroke="#E879F9" stroke-width="1.4" opacity="0.75"/>
    <text class="m" x="596" y="122" fill="#CFC5F7" font-size="12" letter-spacing="2">ASSERT</text>
    <text class="m" x="596" y="144" fill="#7A6AB4" font-size="9">declarative checks, exit codes</text>

    <path d="M843 102L853 92H1055V154L1045 164H843Z" fill="#0F0A1E" stroke="#261B4E"/>
    <path d="M853 92H1055" fill="none" stroke="#C4B5FD" stroke-width="2.4" stroke-linecap="round"/>
    <path class="pulse" d="M843 134L847 130L843 126" fill="none" stroke="#C4B5FD" stroke-width="1.4" opacity="0.75"/>
    <path class="pulse" d="M843 102L853 92H1055V154L1045 164H843Z" fill="none" stroke="#FFB454" stroke-width="1"/>
    <text class="m" x="863" y="122" fill="#CFC5F7" font-size="12" letter-spacing="2">SNAPSHOT</text>
    <text class="m" x="863" y="144" fill="#7A6AB4" font-size="9">behavioural baseline; drift fails</text>
  </g>

  <!-- artefacts -->
  <g class="m fade" style="animation-delay:.3s" font-size="10" fill="#AFA3E0">
    <path d="M42 186L48 180H254V218L248 224H42Z" fill="#0B0716" stroke="#261B4E"/>
    <text x="58" y="207">ephemeral repo copy</text>
    <path d="M309 186L315 180H521V218L515 224H309Z" fill="#0B0716" stroke="#261B4E"/>
    <text x="325" y="207">file + command + tool trace</text>
    <path d="M576 186L582 180H788V218L782 224H576Z" fill="#0B0716" stroke="#261B4E"/>
    <text x="592" y="207">assertion result + message</text>
    <path d="M843 186L849 180H1055V218L1049 224H843Z" fill="#0B0716" stroke="#261B4E"/>
    <text x="859" y="207">baseline diff</text>
  </g>

  <g class="fade" style="animation-delay:.4s">
    <line x1="42" y1="248" x2="1058" y2="248" stroke="#1E1544"/>
    <text class="m" x="42" y="272" fill="#7A6AB4" font-size="10" letter-spacing="1.2">guarantees: argv execution &#183; no shell &#183; environment allow-list &#183; path containment &#183; secret redaction</text>
    <text class="m" x="42" y="294" fill="#7A6AB4" font-size="10" letter-spacing="1.2">suite: unit &#183; integration against a deterministic fake provider &#183; end-to-end on the built binary</text>
    <text class="m" x="42" y="316" fill="#66569E" font-size="10" letter-spacing="1.2">distribution: npm agentsnap &#183; GitHub composite action &#183; Docker sandbox &#183; CI spends no token</text>
  </g>

  <g class="fade" style="animation-delay:.5s">
    <path d="M0.5 38L38 0.5H1062L1099.5 38V292L1062 329.5H38L0.5 292Z" fill="none" stroke="#322466"/>
  </g>
</svg>
