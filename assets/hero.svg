      @keyframes spin{to{transform:rotate(360deg)}}
      .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 120s linear infinite reverse}
      .scan{animation:scan 9s ease-in-out infinite}
      @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(322px)}100%{transform:translateY(0)}}
