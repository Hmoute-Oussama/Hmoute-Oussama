<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-label="Engineering method: spec, build, verify, ship, observe, repeat">
  <title>Engineering method - a closed loop</title>

  <defs>
    <pattern id="lat" width="48" height="27.7128" patternUnits="userSpaceOnUse" fill="none" stroke="#150F2C" stroke-width="1" opacity="0.85"><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(0,0)"/><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(48,0)"/><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(24.0,13.8564)"/><path d="M16 0L8.0 13.8564L-8.0 13.8564L-16 0L-8.0 -13.8564L8.0 -13.8564Z" transform="translate(24.0,-13.8564)"/></pattern>
    <pattern id="lat2" width="156" height="90.0666" patternUnits="userSpaceOnUse" fill="none" stroke="#1B1338" stroke-width="1" opacity="0.5"><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(0,0)"/><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(156,0)"/><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(78.0,45.0333)"/><path d="M52 0L26.0 45.0333L-26.0 45.0333L-52 0L-26.0 -45.0333L26.0 -45.0333Z" transform="translate(78.0,-45.0333)"/></pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D6BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E879F9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9D6BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D6BFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9D6BFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .fade{animation:fade .85s cubic-bezier(.2,.7,.2,1) both}
      @keyframes fade{from{opacity:0}}
      .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
      @keyframes rise{from{opacity:0;transform:translateY(9px)}}
      .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.25s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleX(0)}}
      .draw{stroke-dasharray:1;animation:draw 1.7s cubic-bezier(.3,.7,.3,1) both}
      @keyframes draw{from{stroke-dashoffset:1}}
      .flow{stroke-dasharray:5 9;animation:flow 2.3s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-56}}
      .flow-r{stroke-dasharray:4 11;animation:flow-r 3.4s linear infinite}
      @keyframes flow-r{to{stroke-dashoffset:60}}
      .breathe{animation:breathe 3.8s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.2}50%{opacity:.9}}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .glitch{animation:glitch 7s steps(1) infinite}
      @keyframes glitch{0%,93%,100%{opacity:1}94%{opacity:.25}95%{opacity:1}96%{opacity:.45}97%{opacity:1}}
      .drift{animation:drift 19s ease-in-out infinite}
      @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media (prefers-reduced-motion: reduce){
        .fade,.rise,.grow,.draw,.flow,.flow-r,.breathe,.pulse,.blink,.glitch,.drift{animation:none}
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#05030C"/>
  <rect width="1200" height="300" fill="url(#lat)"/>
  <rect width="1200" height="300" fill="url(#lat2)"/>

  <text class="m" x="40" y="42" fill="#66569E" font-size="11" letter-spacing="2.4">02 / METHOD</text>
  <text class="s" x="40" y="70" fill="#AFA3E0" font-size="15">A loop, not a line. Verification is a stage of building, not an afterthought.</text>
  <path class="draw" pathLength="1" d="M40 88H1160" fill="none" stroke="#1E1544"/>

  <!-- forward edges -->
  <g fill="none" stroke="#54409C" stroke-width="1.4">
    <path class="flow" style="animation-delay:.6s" d="M250 145H310"/>
    <path class="flow" style="animation-delay:.8s" d="M460 145H520"/>
    <path class="flow" style="animation-delay:1s" d="M670 145H730"/>
    <path class="flow" style="animation-delay:1.2s" d="M880 145H940"/>
  </g>
  <g fill="#54409C">
    <path d="M310 145l-9 -5v10z"/>
    <path d="M520 145l-9 -5v10z"/>
    <path d="M730 145l-9 -5v10z"/>
    <path d="M940 145l-9 -5v10z"/>
  </g>

  <!-- feedback edge -->
  <path class="flow-r" fill="none" stroke="#54409C" stroke-width="1.4"
        d="M1040 180V244H160V182"/>
  <path fill="#54409C" d="M160 182l-5 9h10z"/>
  <text class="m" x="600" y="238" fill="#66569E" font-size="10" letter-spacing="2.4" text-anchor="middle">FEEDBACK</text>

  <!-- travelling signal -->
  <circle r="2.6" fill="#9D6BFF"><animateMotion dur="7s" repeatCount="indefinite" path="M250 145H310"/></circle>

  <!-- stages -->
  <g class="fade" style="animation-delay:.15s">
    <path d="M70 122L82 110H250V168L238 180H70Z" fill="#0F0A1E" stroke="#261B4E"/>
    <line x1="82" y1="110" x2="250" y2="110" stroke="#5FD9FF" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M70 152L74 148L70 144" fill="none" stroke="#5FD9FF" stroke-width="1.4" opacity="0.75"/>
    <text class="m" x="88" y="138" fill="#F2ECFF" font-size="13" letter-spacing="2.4">SPEC</text>
    <text class="m" x="88" y="160" fill="#9486CC" font-size="9.5">define the contract</text>
  </g>
  <g class="fade" style="animation-delay:.3s">
    <path d="M280 122L292 110H460V168L448 180H280Z" fill="#0F0A1E" stroke="#261B4E"/>
    <line x1="292" y1="110" x2="460" y2="110" stroke="#9D6BFF" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M280 152L284 148L280 144" fill="none" stroke="#9D6BFF" stroke-width="1.4" opacity="0.75"/>
    <text class="m" x="298" y="138" fill="#F2ECFF" font-size="13" letter-spacing="2.4">BUILD</text>
    <text class="m" x="298" y="160" fill="#9486CC" font-size="9.5">smallest correct change</text>
  </g>
  <g class="fade" style="animation-delay:.45s">
    <path d="M490 122L502 110H670V168L658 180H490Z" fill="#0F0A1E" stroke="#261B4E"/>
    <line x1="502" y1="110" x2="670" y2="110" stroke="#6EF2B0" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M490 152L494 148L490 144" fill="none" stroke="#6EF2B0" stroke-width="1.4" opacity="0.75"/>
    <path class="pulse" d="M490 122L502 110H670V168L658 180H490Z" fill="none" stroke="#6EF2B0" stroke-width="1"/>
    <text class="m" x="508" y="138" fill="#F2ECFF" font-size="13" letter-spacing="2.4">VERIFY</text>
    <text class="m" x="508" y="160" fill="#9486CC" font-size="9.5">evidence, not opinion</text>
  </g>
  <g class="fade" style="animation-delay:.6s">
    <path d="M700 122L712 110H880V168L868 180H700Z" fill="#0F0A1E" stroke="#261B4E"/>
    <line x1="712" y1="110" x2="880" y2="110" stroke="#FFB454" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M700 152L704 148L700 144" fill="none" stroke="#FFB454" stroke-width="1.4" opacity="0.75"/>
    <text class="m" x="718" y="138" fill="#F2ECFF" font-size="13" letter-spacing="2.4">SHIP</text>
    <text class="m" x="718" y="160" fill="#9486CC" font-size="9.5">reproducible release</text>
  </g>
  <g class="fade" style="animation-delay:.75s">
    <path d="M950 122L962 110H1130V168L1118 180H950Z" fill="#0F0A1E" stroke="#261B4E"/>
    <line x1="962" y1="110" x2="1130" y2="110" stroke="#C4B5FD" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M950 152L954 148L950 144" fill="none" stroke="#C4B5FD" stroke-width="1.4" opacity="0.75"/>
    <text class="m" x="968" y="138" fill="#F2ECFF" font-size="13" letter-spacing="2.4">OBSERVE</text>
    <text class="m" x="968" y="160" fill="#9486CC" font-size="9.5">measure, feed back</text>
  </g>

  <path d="M0.5 42L42 0.5H1158L1199.5 42V258L1158 299.5H42L0.5 258Z" fill="none" stroke="#322466"/>
</svg>
