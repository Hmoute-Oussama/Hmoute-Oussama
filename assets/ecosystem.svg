    <path d="M210 420L222 408H1160V460L1148 472H210Z" fill="#0F0A1E" stroke="#261B4E"/>
    <line x1="222" y1="408" x2="1160" y2="408" stroke="#E879F9" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="40" y="408" width="2" height="64" fill="#E879F9"/>
    <text class="m" x="54" y="438" fill="#9486CC" font-size="10.5" letter-spacing="1.6">RUNTIME</text>
    <g font-size="11" fill="#CFC5F7">
      <path d="M210 431L216 425H272V449L266 455H210Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="226" y="444">Docker</text>
      <path d="M284 431L290 425H396V449L390 455H284Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="300" y="444">GitHub Actions</text>
