    <text class="m" x="54" y="362" fill="#9486CC" font-size="10.5" letter-spacing="1.6">ASSURANCE</text>
    <g font-size="11" fill="#CFC5F7">
      <path d="M210 355L216 349H348V373L342 379H210Z" fill="#140E27" stroke="#261B4E"/>
