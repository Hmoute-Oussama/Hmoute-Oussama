    <text class="m" x="54" y="210" fill="#9486CC" font-size="10.5" letter-spacing="1.6">SERVICE</text>
    <g font-size="11" fill="#CFC5F7">
      <path d="M210 203L216 197H278V221L272 227H210Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="226" y="216">FastAPI</text>
      <path d="M290 203L296 197H346V221L340 227H290Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="306" y="216">Flask</text>
      <path d="M358 203L364 197H426V221L420 227H358Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="374" y="216">Express</text>
      <path d="M438 203L444 197H544V221L538 227H438Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="454" y="216">Java services</text>
      <path d="M556 203L562 197H606V221L600 227H556Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="572" y="216">REST</text>
      <path d="M618 203L624 197H706V221L700 227H618Z" fill="#140E27" stroke="#261B4E"/>
      <text class="m" x="634" y="216">WebSockets</text>
    </g>
    <text class="m" x="1150" y="217" fill="#7A6AB4" font-size="10" letter-spacing="1.4" text-anchor="end">typed APIs and service boundaries</text>
  </g>

  <!-- band 3 -->
  <g class="fade" style="animation-delay:.3s">
    <path d="M210 268L222 256H1160V308L1148 320H210Z" fill="#0F0A1E" stroke="#261B4E"/>
    <line x1="222" y1="256" x2="1160" y2="256" stroke="#C4B5FD" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="40" y="256" width="2" height="64" fill="#C4B5FD"/>
    <text class="m" x="54" y="286" fill="#9486CC" font-size="10.5" letter-spacing="1.6">INTELLIGENCE</text>
    <g font-size="11" fill="#CFC5F7">
