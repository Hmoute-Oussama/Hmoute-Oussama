  <text class="m" x="40" y="574" fill="#66569E" font-size="10" letter-spacing="2">A LAYER IS A RESPONSIBILITY, NOT A CATEGORY OF BADGE</text>
  <path d="M0.5 42L42 0.5H1158L1199.5 42V558L1158 599.5H42L0.5 558Z" fill="none" stroke="#322466"/>
